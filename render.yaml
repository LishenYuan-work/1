services:
  - type: web
    name: review-platform-api
    runtime: docker
    # Keep the API deployment on the same branch as the Vercel frontend.
    branch: main
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: AUTH_PROVIDER
        value: supabase
      - key: EMAIL_PROVIDER
        # Supabase Auth handles signup/password emails. Organization invites
        # are sent by the backend adapter and therefore still require Resend.
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Review Platform <onboarding@resend.dev>"
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: review-documents
      - key: REVIEW_RUNTIME
        value: custom
      - key: MAX_UPLOAD_FILES
        value: "5"
      - key: MAX_UPLOAD_BYTES
        value: "20971520"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: RATE_LIMIT_BACKEND
        value: database
