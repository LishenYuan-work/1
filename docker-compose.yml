# 本地开发 docker-compose（后端 + Supabase 本地模拟）
version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # 生产用 Supabase，本地开发用 SQLite，无需额外服务
